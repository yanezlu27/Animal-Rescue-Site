<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Rescue 💗</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Animal Rescue 💖</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#about">About</a>
    <a href="#adopt">Adopt</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero">
  <h2>Saving Lives, One Paw at a Time 🐾</h2>
  <img src="images/dog.jpg" alt="Dog">
</section>

<section id="about">
  <h2>About Us</h2>
  <p>We rescue animals and help them find loving homes.</p>
</section>

<section id="adopt">
  <h2>Animals for Adoption</h2>
  <div class="cards">
    <div class="card">
      <img src="images/dog2.jpg">
      <h3>Buddy</h3>
      <p>Playful and friendly!</p>
    </div>
    <div class="card">
      <img src="images/cat.jpg">
      <h3>Luna</h3>
      <p>Sweet and calm.</p>
    </div>
    <div class="card">
      <img src="images/puppy.jpg">
      <h3>Max</h3>
      <p>Energetic puppy!</p>
    </div>
  </div>
</section>

<section id="contact">
  <h2>Contact</h2>
  <p>Email: rescue@email.com</p>
</section>

<footer>
  <p>© 2026 Animal Rescue</p>
</footer>

</body>
</html>
