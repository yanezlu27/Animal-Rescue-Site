<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Rescue</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #ffe6f0;
      color: #333;
    }
    header {
      background: #ff99cc;
      padding: 20px;
      text-align: center;
      color: white;
      font-size: 2em;
      letter-spacing: 2px;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #ffb3d9;
      padding: 10px;
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .hero {
      text-align: center;
      padding: 40px;
    }
    .hero img {
      width: 80%;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .section {
      padding: 40px;
      text-align: center;
    }
    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .card {
      background: white;
      border-radius: 15px;
      width: 250px;
      padding: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .card img {
      width: 100%;
      border-radius: 10px;
    }
    footer {
      background: #ff99cc;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>

<header>
  Animal Rescue 💖
</header>

<nav>
  <a href="#">Home</a>
  <a href="#about">About</a>
  <a href="#adopt">Adopt</a>
  <a href="#contact">Contact</a>
</nav>

<section class="hero">
</html>
